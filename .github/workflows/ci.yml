name: Android checks
# created by chatgpt-codex
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_call:
    inputs:
      commit:
        type: string
        required: false
        default: ""
      retention_days:
        type: number
        required: false
        default: 14
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wrapper:
    name: Wrapper integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - run: python3 tools/ci/verify_wrapper.py
      - run: python3 tools/ci/test_required_gate.py
      - run: python3 tools/ci/test_prepare_release.py
      - run: python3 tools/ci/test_publish_release.py
      - run: python3 tools/ci/test_signed_release.py
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
  build:
    name: Build, unit regressions, and Lint
    needs: wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /home/runner/android-sdk-pinned
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21.0.8+9.0.LTS
      - run: tools/ci/setup_android.sh
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: ./gradlew --no-daemon --dependency-verification=strict assembleDebug assembleRelease testDebugUnitTest testReleaseUnitTest createDebugUnitTestCoverageReport lintDebug lintRelease assembleDebugAndroidTest
      - run: python3 tools/ci/verify_apk_identity.py
      - name: Retain builds and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-and-unit-evidence
          path: |
            app/build/outputs/
            app/build/reports/
            app/build/test-results/
            build/reports/
          retention-days: ${{ inputs.retention_days || 14 }}
          if-no-files-found: error
  screenshots:
    name: Pinned Linux screenshot verification
    needs: wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - run: tools/ci/screenshots.sh verify
      - name: Retain screenshot comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-evidence
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/
            app/build/test-results/
          retention-days: ${{ inputs.retention_days || 14 }}
          if-no-files-found: error
  device:
    name: API ${{ matrix.api }} integration and critical flows
    needs: wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    env:
      ANDROID_HOME: /home/runner/android-sdk-pinned
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21.0.8+9.0.LTS
      - run: tools/ci/setup_android.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          test -r /dev/kvm && test -w /dev/kvm
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: tools/ci/run_emulator.sh '${{ matrix.api }}' critical
      - name: Retain device evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-api-${{ matrix.api }}
          path: |
            ci-artifacts/
            app/build/reports/androidTests/
            app/build/reports/coverage/
            app/build/outputs/androidTest-results/
            app/build/outputs/code_coverage/
          retention-days: ${{ inputs.retention_days || 14 }}
          if-no-files-found: error
  required:
    name: Required Android checks
    if: always()
    needs: [wrapper, build, screenshots, device]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - run: python3 tools/ci/required_gate.py '${{ toJSON(needs) }}' wrapper build screenshots device
