name: Create release
# created by chatgpt-codex
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to prepare (must match the app version)
        required: true
        default: '2.0.1'
        type: string
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: create-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false
jobs:
  release:
    name: Build APKs and publish signed release or prepare draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_HOME: /home/runner/android-sdk-pinned
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and Gradle wrapper
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 tools/ci/verify_wrapper.py
          python3 tools/ci/test_prepare_release.py
          python3 tools/ci/test_publish_release.py
          python3 tools/ci/test_signed_release.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21.0.8+9.0.LTS
      - run: tools/ci/setup_android.sh
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Build and verify APK identities
        run: |
          ./gradlew --no-daemon --dependency-verification=strict assembleDebug assembleRelease
          python3 tools/ci/verify_apk_identity.py
      - name: Verify signed APK or prepare unsigned draft
        id: package
        run: |
          if test -f "release-assets/$RELEASE_TAG/Judgement-Scoreboard-$RELEASE_TAG.apk"; then
            python3 tools/ci/verify_signed_release.py
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci/prepare_release.py
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish installable release with the new signing key
        if: steps.package.outputs.signed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ github.sha }}
          RELEASE_SIGNING_MODE: new
          EVIDENCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci/publish_release.py
      - name: Create v2 release draft
        if: steps.package.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "Judgement Scoreboard $RELEASE_TAG" --draft \
            --notes-file release-draft/RELEASE_NOTES.md release-draft/*
          printf '### Release draft created\n\nOpen [repository releases](%s/%s/releases) to view the draft.\n\nAdd the APK signed with the new release key under release-assets/VERSION before publishing.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain release files even if draft creation fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: judgement-scoreboard-${{ env.RELEASE_TAG }}
          path: |
            release-draft/
            release/
          retention-days: 90
          if-no-files-found: warn
