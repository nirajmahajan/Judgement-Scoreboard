plugins {
    id 'com.android.application'
    id 'io.github.takahirom.roborazzi'
}

android {
    namespace 'android.example.judgement'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'android.example.judgement'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '2.0.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments clearPackageData: 'true'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ['room.schemaLocation': "$projectDir/schemas".toString(),
                             'room.incremental': 'true', 'room.generateKotlin': 'false']
            }
        }
    }
    buildTypes {
        debug {
            enableAndroidTestCoverage true
            enableUnitTestCoverage true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
    testCoverage {
        jacocoVersion '0.8.13'
    }
    testOptions {
        animationsDisabled true
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'robolectric.graphicsMode', 'NATIVE'
            testLogging {
                events 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        htmlReport true
        xmlReport true
        sarifReport true
    }
    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'androidx.room:room-testing:2.8.5'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.76.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.76.0'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    androidTestImplementation 'com.google.android.apps.common.testing.accessibility.framework:accessibility-test-framework:4.1.1'
}

configurations.configureEach { configuration ->
    if (configuration.name.endsWith('CompileClasspath') ||
            configuration.name.endsWith('RuntimeClasspath') ||
            configuration.name.endsWith('AnnotationProcessorClasspath')) {
        configuration.resolutionStrategy.activateDependencyLocking()
    }
}
dependencyLocking {
    lockMode = LockMode.STRICT
}

roborazzi {
    outputDir.set(file('src/test/screenshots'))
    compare {
        outputDir.set(file('build/outputs/roborazzi'))
    }
}
